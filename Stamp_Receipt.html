        function filterObject(obj, filter = [undefined, null]) {
            Object.keys(obj).forEach((key) =>
                filter.includes(obj[key]) ? delete obj[key] : {}
            );
            return obj;
        }

        function objectToQuery(object) {
            const queryString = new URLSearchParams(object).toString();
            if (queryString) return "?" + queryString;
            else return "";
        }

        function getStampData() {
            document.getElementById('loader-overlay').style.display = 'flex';

            fetch('https://sapi.punjab-zameen.pk/api/stamp/by' + objectToQuery(filterObject({

                    stampId: stampId
                })))
                .then(function(response) {

        function formatDateTime(dateTimeStr) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const dateTimeParts = dateTimeStr.split(', ');
            const datePart = dateTimeParts[0];
            const timePart = dateTimeParts[1];

            const dateParts = datePart.split('/');
            const day = parseInt(dateParts[1], 10);
            const month = months[parseInt(dateParts[0], 10) - 1];
            const year = parseInt(dateParts[2], 10);

            const timeParts = timePart.split(' ');
            const time = timeParts[0];
            const ampm = timeParts[1];
            const [hours, minutes, seconds] = time.split(':');

            return `${day}-${month}-${year} ${hours}:${minutes}:${seconds} ${ampm}`;
        }


        function formatDate(dateStr) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const date = new Date(dateStr);
            const day = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();

            return `${day}-${month}-${year}`;
        }

        function toCamelCase(str) {
            const words = str.split(' ');
            const camelCaseWords = words.map((word, index) => {
                if (index === 0) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                } else {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
            });
            return camelCaseWords.join(' ');
        }
